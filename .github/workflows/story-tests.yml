# Runs all JavaScript tests (old game tests and story tests) for every pull request.
name: Story tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run node --test
        working-directory: web
        run: node --test
